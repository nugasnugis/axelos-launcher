<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">

    <meta
        name="viewport"
        content="width=device-width, initial-scale=1.0"
    >

    <meta
        name="theme-color"
        content="#050811"
    >

    <title>AxelOS Cloud Desktop</title>

    <style>
        :root {
            --bg: #050811;
            --panel: rgba(10, 16, 30, .82);
            --panel-2: #0b1220;

            --blue: #4f8cff;
            --cyan: #38d9ff;
            --purple: #765cff;
            --green: #3ee58a;
            --orange: #ffb454;
            --red: #ff5d6c;

            --text: #f5f8ff;
            --muted: #8492aa;

            --border: rgba(133, 163, 219, .15);
        }

        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;

            display: flex;
            align-items: center;
            justify-content: center;

            overflow: hidden;

            color: var(--text);

            font-family:
                Inter,
                ui-sans-serif,
                system-ui,
                -apple-system,
                BlinkMacSystemFont,
                "Segoe UI",
                sans-serif;

            background:
                radial-gradient(
                    circle at 50% -10%,
                    rgba(79,140,255,.20),
                    transparent 42%
                ),
                radial-gradient(
                    circle at 100% 100%,
                    rgba(118,92,255,.12),
                    transparent 38%
                ),
                var(--bg);
        }

        body::before {
            content: "";

            position: fixed;
            inset: 0;

            pointer-events: none;

            opacity: .18;

            background-image:
                linear-gradient(
                    rgba(255,255,255,.025) 1px,
                    transparent 1px
                ),
                linear-gradient(
                    90deg,
                    rgba(255,255,255,.025) 1px,
                    transparent 1px
                );

            background-size: 42px 42px;
        }

        .shell {
            width: min(92vw, 520px);

            position: relative;

            padding: 34px;

            border:
                1px solid var(--border);

            border-radius: 24px;

            background:
                linear-gradient(
                    145deg,
                    rgba(13,22,40,.92),
                    rgba(7,11,21,.88)
                );

            box-shadow:
                0 40px 100px rgba(0,0,0,.55),
                0 0 80px rgba(79,140,255,.06);

            backdrop-filter: blur(24px);
        }

        .brand {
            display: flex;
            align-items: center;
            gap: 13px;

            margin-bottom: 32px;
        }

        .logo {
            width: 45px;
            height: 45px;

            display: flex;
            align-items: center;
            justify-content: center;

            border-radius: 13px;

            color: white;

            font-weight: 950;
            font-size: 14px;
            letter-spacing: 1px;

            background:
                linear-gradient(
                    135deg,
                    var(--blue),
                    var(--purple)
                );

            box-shadow:
                0 0 30px
                rgba(79,140,255,.30);
        }

        .brand-name {
            font-size: 16px;
            font-weight: 900;
            letter-spacing: 4px;
        }

        .brand-subtitle {
            margin-top: 3px;

            color: var(--cyan);

            font-size: 8px;
            font-weight: 800;

            letter-spacing: 3px;
        }

        h1 {
            margin: 0 0 10px;

            font-size: 30px;
            letter-spacing: -1px;
        }

        .description {
            margin: 0 0 28px;

            color: var(--muted);

            font-size: 14px;
            line-height: 1.65;
        }

        .specs {
            display: grid;
            grid-template-columns: repeat(3, 1fr);

            gap: 9px;

            margin-bottom: 24px;
        }

        .spec {
            padding: 12px;

            border:
                1px solid var(--border);

            border-radius: 12px;

            background:
                rgba(255,255,255,.025);
        }

        .spec-label {
            color: var(--muted);

            font-size: 8px;
            font-weight: 800;

            letter-spacing: 1.4px;
            text-transform: uppercase;
        }

        .spec-value {
            margin-top: 5px;

            font-size: 13px;
            font-weight: 800;
        }

        button {
            width: 100%;

            border: 0;

            padding: 15px;

            border-radius: 12px;

            color: white;

            font-size: 14px;
            font-weight: 800;

            cursor: pointer;

            background:
                linear-gradient(
                    135deg,
                    var(--blue),
                    var(--purple)
                );

            box-shadow:
                0 12px 30px
                rgba(79,140,255,.20);

            transition:
                transform .2s,
                filter .2s;
        }

        button:hover {
            filter: brightness(1.1);
            transform: translateY(-1px);
        }

        button:disabled {
            cursor: wait;
            opacity: .55;
            transform: none;
        }

        .status {
            margin-top: 18px;

            min-height: 48px;

            display: flex;
            align-items: center;

            padding: 12px 14px;

            border:
                1px solid var(--border);

            border-radius: 12px;

            background:
                rgba(2,5,12,.72);

            color: var(--muted);

            font-family:
                "SFMono-Regular",
                Consolas,
                monospace;

            font-size: 11px;
        }

        .status-dot {
            width: 7px;
            height: 7px;

            flex: 0 0 auto;

            margin-right: 10px;

            border-radius: 50%;

            background: var(--blue);

            box-shadow:
                0 0 12px currentColor;
        }

        .status-dot.online {
            color: var(--green);
            background: var(--green);
        }

        .status-dot.warning {
            color: var(--orange);
            background: var(--orange);
        }

        .status-dot.error {
            color: var(--red);
            background: var(--red);
        }

        .footer {
            margin-top: 24px;

            color: #56647b;

            font-size: 9px;
            text-align: center;

            letter-spacing: 1px;
        }

        @media (max-width: 500px) {
            .shell {
                padding: 25px;
                border-radius: 20px;
            }

            h1 {
                font-size: 26px;
            }
        }
    </style>
</head>

<body>

<div class="shell">

    <div class="brand">

        <div class="logo">
            AX
        </div>

        <div>
            <div class="brand-name">
                AXELOS
            </div>

            <div class="brand-subtitle">
                CLOUD DESKTOP
            </div>
        </div>

    </div>

    <h1>
        Run AxelOS Online
    </h1>

    <p class="description">
        Launch a temporary AxelOS x86_64 desktop directly
        in your browser. No installation required.
    </p>

    <div class="specs">

        <div class="spec">
            <div class="spec-label">
                Architecture
            </div>

            <div class="spec-value">
                x86_64
            </div>
        </div>

        <div class="spec">
            <div class="spec-label">
                Memory
            </div>

            <div class="spec-value">
                4 GB
            </div>
        </div>

        <div class="spec">
            <div class="spec-label">
                CPU
            </div>

            <div class="spec-value">
                2 vCPU
            </div>
        </div>

    </div>

    <button
        id="launch-btn"
        onclick="launchAxelOS()"
    >
        Launch AxelOS
    </button>

    <div class="status">

        <span
            id="status-dot"
            class="status-dot"
        ></span>

        <span id="status-text">
            System ready
        </span>

    </div>

    <div class="footer">
        TEMPORARY CLOUD SESSION ï¿½ AUTOMATIC IDLE SHUTDOWN
    </div>

</div>

<script>

const launchButton =
    document.getElementById("launch-btn");

const statusText =
    document.getElementById("status-text");

const statusDot =
    document.getElementById("status-dot");

let pollTimer = null;

let pollBusy = false;

let pollSeconds = 0;


function setStatus(
    text,
    type = ""
) {
    statusText.textContent = text;

    statusDot.className =
        "status-dot " + type;
}


async function getStatus() {

    const response =
        await fetch(
            "/api/status?t=" + Date.now(),
            {
                cache: "no-store"
            }
        );

    if (!response.ok) {
        throw new Error(
            "Status service unavailable"
        );
    }

    return response.json();
}


async function launchAxelOS() {

    if (pollTimer) {
        clearInterval(pollTimer);
        pollTimer = null;
    }

    launchButton.disabled = true;

    setStatus(
        "Checking AxelOS session...",
        "warning"
    );

    try {

        const current =
            await getStatus();

        if (
            current.status === "ready" &&
            current.url
        ) {

            setStatus(
                "AxelOS is ready. Opening desktop...",
                "online"
            );

            setTimeout(
                () => {
                    window.location.href =
                        current.url;
                },
                350
            );

            return;
        }


        if (
            current.status === "active"
        ) {

            setStatus(
                "AxelOS is currently in use.",
                "warning"
            );

            launchButton.disabled = false;

            return;
        }


        if (
            current.status === "booting"
        ) {

            beginPolling();

            return;
        }


        const response =
            await fetch(
                "/api/launch",
                {
                    method: "POST",

                    headers: {
                        "Content-Type":
                            "application/json"
                    }
                }
            );

        const result =
            await response.json();


        if (
            !response.ok ||
            !result.success
        ) {

            if (
                result.status === "active"
            ) {
                throw new Error(
                    "AxelOS is already in use."
                );
            }

            if (
                result.status === "booting"
            ) {
                beginPolling();
                return;
            }

            throw new Error(
                result.error ||
                "Unable to launch AxelOS."
            );
        }


        setStatus(
            "Provisioning AxelOS cloud desktop...",
            "warning"
        );

        beginPolling();

    } catch (error) {

        console.error(error);

        setStatus(
            error.message ||
            "Launch failed.",
            "error"
        );

        launchButton.disabled = false;
    }
}


function beginPolling() {

    if (pollTimer) {
        clearInterval(pollTimer);
    }

    pollSeconds = 0;

    setStatus(
        "Booting AxelOS...",
        "warning"
    );

    pollTimer =
        setInterval(
            pollSession,
            3000
        );

    pollSession();
}


async function pollSession() {

    if (pollBusy) {
        return;
    }

    pollBusy = true;

    pollSeconds += 3;

    try {

        const state =
            await getStatus();


        if (
            state.status === "ready" &&
            state.url
        ) {

            clearInterval(
                pollTimer
            );

            pollTimer = null;

            setStatus(
                "AxelOS ready. Opening desktop...",
                "online"
            );

            setTimeout(
                () => {
                    window.location.href =
                        state.url;
                },
                500
            );

            return;
        }


        if (
            state.status === "active"
        ) {

            clearInterval(
                pollTimer
            );

            pollTimer = null;

            setStatus(
                "AxelOS is already in use.",
                "warning"
            );

            launchButton.disabled = false;

            return;
        }


        if (
            state.status === "booting"
        ) {

            setStatus(
                `Starting AxelOS... ${pollSeconds}s`,
                "warning"
            );

        } else {

            clearInterval(
                pollTimer
            );

            pollTimer = null;

            setStatus(
                "Session ended. Try again.",
                "error"
            );

            launchButton.disabled = false;
        }


        if (pollSeconds >= 300) {

            clearInterval(
                pollTimer
            );

            pollTimer = null;

            setStatus(
                "Boot timeout. Please try again.",
                "error"
            );

            launchButton.disabled = false;
        }

    } catch (error) {

        console.warn(
            "Polling error:",
            error
        );

    } finally {

        pollBusy = false;
    }
}

</script>
